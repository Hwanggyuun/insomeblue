name: Deploy to Ivy Hosting

on:
  push:
    branches: [release]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_KAKAOMAP_JAVASCRIPT_APP_KEY: ${{ secrets.VITE_KAKAOMAP_JAVASCRIPT_APP_KEY }}
          VITE_IMAGEKIT_BASE_URL: ${{ secrets.VITE_IMAGEKIT_BASE_URL }}
        run: npm run build

      - name: Deploy via SFTP (scp) using password
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          # password-based SFTP (set SFTP_PASSWORD in Secrets)
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          source: "./dist/*"
          target: ${{ secrets.SFTP_DESTINATION }}/
